---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload udev
  ansible.builtin.command: udevadm control --reload
  changed_when: true

- name: Apply OMV changes
  ansible.builtin.command: omv-rpc -u admin Config applyChanges '{"modules":["compose"],"force":false}'
  changed_when: true
